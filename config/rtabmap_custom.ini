# RTAB-Map 配置 - Factor Perception SDK + 3D避障
# 基于: /opt/ros/jazzy/share/factor_perception/config/rtabmap.ini
# 修改: 启用3D避障功能
# 版本: v2.3 - 2026-06-21

# ============ 核心参数 ============

[Core]
GTSAM\Incremental = true

# ============ 3D 地图（启用3D避障） ============
# 3D避障需要启用此参数

Grid\3D = true
Grid\CellSize = 0.05
Grid\ClusterRadius = 0.1
Grid\DepthDecimation = 4
Grid\DepthRoiRatios = 0.025 0.025 0.025 0.025
Grid\FlatObstacleDetected = false
Grid\FootprintHeight = 1.4
Grid\FootprintLength = 0.5
Grid\FootprintWidth = 0.5
Grid\GroundIsObstacle = false
Grid\MapFrameProjection = false
Grid\MaxGroundAngle = 45.0
Grid\MaxGroundHeight = 0.05
Grid\MaxObstacleHeight = 1.5
Grid\MinClusterSize = 10
Grid\MinGroundHeight = -0.05
Grid\NoiseFilteringMinNeighbors = 5
Grid\NoiseFilteringRadius = 0.1
Grid\NormalK = 20
Grid\NormalsSegmentation = true
Grid\PreVoxelFiltering = true
Grid\RangeMax = 5.0
Grid\RangeMin = 0.0
Grid\RayTracing = true
Grid\Scan2dUnknownSpaceFilled = false
Grid\ScanDecimation = 1
Grid\Sensor = 1

# ============ 全局栅格 ============

GridGlobal\AltitudeDelta = 0.0
GridGlobal\Eroded = false
GridGlobal\FloodFillDepth = 0
GridGlobal\FootprintRadius = 0.5
GridGlobal\MaxNodes = 0
GridGlobal\MinSize = 0.0
GridGlobal\OccupancyThr = 0.5
GridGlobal\ProbClampingMax = 0.971
GridGlobal\ProbClampingMin = 0.1192
GridGlobal\ProbHit = 0.7
GridGlobal\ProbMiss = 0.4
GridGlobal\UpdateError = 0.01

# ============ 视觉特征 ============

Kp\BadSignRatio = 0.0
Kp\DetectorStrategy = 1
Kp\TfIdfLikelihoodUsed = true

# ============ 记忆管理 ============

Mem\BinDataKept = true
Mem\NotLinkedNodesKept = false
Mem\ReduceGraph = true
Mem\RehearsalSimilarity = 0.9
Mem\InitWMWithAllNodes = false

# ============ 优化器 ============

Optimizer\GravitySigma = 0.0
Optimizer\Robust = true

# ============ RGBD 参数 ============

RGBD\LocalBundleOnLoopClosure = true
RGBD\LoopCovLimited = true
RGBD\OptimizeMaxError = 1.0
RGBD\ForceOdom3DoF = true

# ============ 闭环检测 ============

Rtabmap\DetectionRate = 1.0
Rtabmap\LoopThr = 0.11
Rtabmap\MemoryThr = 1000
Rtabmap\TimeThr = 700.0
Rtabmap\VirtualPlaceLikelihoodRatio = 0
Rtabmap\WorkingDirectory = ~/.ros

# ============ SIFT ============

SIFT\RootSIFT = true

# ============ 视觉匹配 ============

Vis\CorNNType = 5
Vis\FeatureType = 1
Vis\PnPSplitLinearCovComponents = true
Vis\PnPVarianceMedianRatio = 2

# ============ g2o ============

g2o\PixelVariance = 2.0

# ============ 数据库 ============

DbSqlite3\Synchronous = 1

# ============ 注册 ============

Reg\Force3DoF = true