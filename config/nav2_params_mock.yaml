# Nav2 配置文件 - 人形机器人
# 机器人半径: 0.5m
# 最大速度: 0.3m/s
# 传感器: Factor Perception (OAK-D Pro)

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /factor_perception/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # plugin_lib_names 使用 bt_navigator 默认值即可
    # 显式指定会导致 ComputePathToPose ID 重复注册


controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.1
      stateful: True

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.2          # 与 vx_max 对齐
      lookahead_dist: 1.0
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.5
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.4
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      allow_reversing: false           # 人形不允许倒退
      use_rotate_to_heading: true      # 人形可原地旋转对准
      rotate_to_heading_min_angle: 0.5
      max_angular_accel: 0.8
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: True
      width: 3
      height: 3
      resolution: 0.05
      track_unknown_space: False
      always_send_full_costmap: True
      update_frequency: 5.0
      publish_frequency: 2.0
      filter_threshold: 0.1
      transform_tolerance: 0.4  # RTAB-Map TF 初始化需要时间

      # 机器人 footprint（16点近似圆形，半径0.5m）
      # Nav2 不接受单数字简写，必须用多边形顶点列表
      # 人形机器人用圆形 footprint，与 RTAB-Map GridGlobal FootprintRadius 统一
      footprint: "[[0.5, 0.0], [0.461, 0.191], [0.354, 0.354], [0.191, 0.461], [0.0, 0.5], [-0.191, 0.461], [-0.354, 0.354], [-0.461, 0.191], [-0.5, 0.0], [-0.461, -0.191], [-0.354, -0.354], [-0.191, -0.461], [0.0, -0.5], [0.191, -0.461], [0.354, -0.354], [0.461, -0.191]]"

      # 观测源（告诉 costmap 处理哪些层的观测数据）
      observation_sources: pointcloud

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: "pointcloud"
        pointcloud:
          topic: /factor_perception/cloud_obstacles
          data_type: "PointCloud2"
          clearing: True
          marking: True
          max_obstacle_height: 1.4
          min_obstacle_height: 0.2
          obstacle_range: 2.5
          raytrace_range: 3.0
          inf_is_valid: False
          filter_threshold: 0.2

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.7
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: map
      robot_base_frame: base_link
      rolling_window: False
      resolution: 0.05
      track_unknown_space: True
      use_maximum: False
      always_send_full_costmap: True
      unknown_cost_value: 255
      update_frequency: 1.0
      publish_frequency: 1.0

      # 地图 topic（RTAB-Map 直接发布到 /factor_perception/map）
      map_topic: /factor_perception/map

      # 机器人 footprint（16点近似圆形，半径0.5m，与 local_costmap 统一）
      footprint: "[[0.5, 0.0], [0.461, 0.191], [0.354, 0.354], [0.191, 0.461], [0.0, 0.5], [-0.191, 0.461], [-0.354, 0.354], [-0.461, 0.191], [-0.5, 0.0], [-0.461, -0.191], [-0.354, -0.354], [-0.191, -0.461], [0.0, -0.5], [0.191, -0.461], [0.354, -0.354], [0.461, -0.191]]"

      # 观测源（告诉 costmap 处理哪些层的观测数据）
      observation_sources: pointcloud

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: True
        map_topic: /factor_perception/map
        first_map_only: False
        subscribe_to_updates: True
        use_maximum: False
        unknown_cost_value: 255
        trinary_costmap: True
        track_unknown_space: True
        transform_tolerance: 2.0  # RTAB-Map 建图/定位初始化需要时间

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: "pointcloud"
        pointcloud:
          topic: /factor_perception/cloud_obstacles
          data_type: "PointCloud2"
          clearing: True
          marking: True
          max_obstacle_height: 1.4
          min_obstacle_height: 0.2
          obstacle_range: 3.0
          raytrace_range: 3.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.7
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      # 全局路径规划器：SmacPlanner2D（2D A* + 路径平滑）
      # 人形可原地旋转，无需 Hybrid A* 的最小转弯半径约束（实测 Hybrid A* 会因转弯半径限制规划失败）
      plugin: "nav2_smac_planner::SmacPlanner2D"
      downsample_costmap: false
      max_planning_time: 3.0

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
      spin_dist: 1.57
      time_allowance: 30.0
    backup:
      plugin: "nav2_behaviors::BackUp"
      backup_dist: 0.3
      time_allowance: 30.0
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      dist_to_travel: 0.5
      time_allowance: 30.0
    wait:
      plugin: "nav2_behaviors::Wait"
      wait_time: 5.0
      time_allowance: 30.0

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    max_velocity: [0.2, 0.0, 0.4]    # 对齐 MPPI vx_max/wz_max
    min_velocity: [-0.1, 0.0, -0.4]
    max_accel: [0.25, 0.0, 0.6]      # 人形缓加速，防前倾
    min_accel: [-0.3, 0.0, -0.8]     # 缓减速，防前倾
    odom_topic: "/factor_perception/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    observation_sources: ["pointcloud"]
    pointcloud:
      topic: /factor_perception/cloud_obstacles
      data_type: "PointCloud2"
    # 使用机器人 footprint 接近检测（与 costmap footprint 一致）
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6

costmap_filters:
  ros__parameters:
    use_sim_time: False