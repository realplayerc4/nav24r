# Nav2 配置文件 - 人形机器人
# 机器人半径: 0.5m
# 最大速度: 0.3m/s
# 传感器: Factor Perception (OAK-D Pro)

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /factor_perception/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # plugin_lib_names 使用 bt_navigator 默认值即可
    # 显式指定会导致 ComputePathToPose ID 重复注册


controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.1
      stateful: True

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.3
      vx_min: -0.1
      vy_max: 0.0
      wz_max: 0.5
      iteration_count: 1
      prune_distance: 1.0
      trajectory_step: 0.1
      keep_last_n_paths: 5
      motion_model: "Omni"
      optimize_dt: True
      CriticPluginNames:
        - "PathAlignCritic"
        - "GoalAlignCritic"
        - "ObstaclesCritic"
        - "CostCritic"
      PathAlignCritic:
        plugin: "nav2_mppi_controller::PathAlignCritic"
        enabled: True
        cost_power: 1
        cost_weight: 2.0
        heuristic: 0.5
        path_point_step: 4
      GoalAlignCritic:
        plugin: "nav2_mppi_controller::GoalAlignCritic"
        enabled: True
        cost_power: 1
        cost_weight: 1.0
        heuristic: 0.0
      ObstaclesCritic:
        plugin: "nav2_mppi_controller::ObstaclesCritic"
        enabled: True
        cost_power: 1
        repulsion_cost_weight: 5.0
        critical_cost_weight: 300.0
        consider_footprint: True
        collision_cost_weight: 1000.0
        collision_margin_distance: 0.1
        near_goal_distance: 0.5
      CostCritic:
        plugin: "nav2_mppi_controller::CostCritic"
        enabled: True
        cost_power: 1
        cost_weight: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: True
      width: 3
      height: 3
      resolution: 0.05
      track_unknown_space: False
      always_send_full_costmap: True
      update_frequency: 5.0
      publish_frequency: 2.0
      filter_threshold: 0.1
      transform_tolerance: 0.4  # RTAB-Map TF 初始化需要时间

      # 机器人 footprint（16点近似圆形，半径0.5m）
      # Nav2 不接受单数字简写，必须用多边形顶点列表
      # 人形机器人用圆形 footprint，与 RTAB-Map GridGlobal FootprintRadius 统一
      footprint: "[[0.5, 0.0], [0.461, 0.191], [0.354, 0.354], [0.191, 0.461], [0.0, 0.5], [-0.191, 0.461], [-0.354, 0.354], [-0.461, 0.191], [-0.5, 0.0], [-0.461, -0.191], [-0.354, -0.354], [-0.191, -0.461], [0.0, -0.5], [0.191, -0.461], [0.354, -0.354], [0.461, -0.191]]"

      # 观测源（告诉 costmap 处理哪些层的观测数据）
      observation_sources: pointcloud

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: "pointcloud"
        pointcloud:
          topic: /factor_perception/cloud_obstacles
          data_type: "PointCloud2"
          clearing: True
          marking: True
          max_obstacle_height: 1.4
          min_obstacle_height: 0.2
          obstacle_range: 2.5
          raytrace_range: 3.0
          inf_is_valid: False
          filter_threshold: 0.2

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.6
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: map
      robot_base_frame: base_link
      rolling_window: False
      resolution: 0.05
      track_unknown_space: True
      use_maximum: False
      always_send_full_costmap: True
      unknown_cost_value: 255
      update_frequency: 1.0
      publish_frequency: 1.0

      # 地图 topic（RTAB-Map 直接发布到 /factor_perception/map）
      map_topic: /factor_perception/map

      # 机器人 footprint（16点近似圆形，半径0.5m，与 local_costmap 统一）
      footprint: "[[0.5, 0.0], [0.461, 0.191], [0.354, 0.354], [0.191, 0.461], [0.0, 0.5], [-0.191, 0.461], [-0.354, 0.354], [-0.461, 0.191], [-0.5, 0.0], [-0.461, -0.191], [-0.354, -0.354], [-0.191, -0.461], [0.0, -0.5], [0.191, -0.461], [0.354, -0.354], [0.461, -0.191]]"

      # 观测源（告诉 costmap 处理哪些层的观测数据）
      observation_sources: pointcloud

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: True
        map_topic: /factor_perception/map
        first_map_only: False
        subscribe_to_updates: True
        use_maximum: False
        unknown_cost_value: 255
        trinary_costmap: True
        track_unknown_space: True
        transform_tolerance: 2.0  # RTAB-Map 建图/定位初始化需要时间

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: "pointcloud"
        pointcloud:
          topic: /factor_perception/cloud_obstacles
          data_type: "PointCloud2"
          clearing: True
          marking: True
          max_obstacle_height: 1.4
          min_obstacle_height: 0.2
          obstacle_range: 3.0
          raytrace_range: 3.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.6
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      # 全局路径规划器（NavFn，支持 A*）
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: True
      allow_unknown: True

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
      spin_dist: 1.57
      time_allowance: 30.0
    backup:
      plugin: "nav2_behaviors::BackUp"
      backup_dist: 0.3
      time_allowance: 30.0
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      dist_to_travel: 0.5
      time_allowance: 30.0
    wait:
      plugin: "nav2_behaviors::Wait"
      wait_time: 5.0
      time_allowance: 30.0

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    max_velocity: [0.3, 0.0, 0.5]
    min_velocity: [-0.1, 0.0, -0.5]
    max_accel: [0.5, 0.0, 1.0]
    min_accel: [-0.5, 0.0, -1.0]
    odom_topic: "/factor_perception/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    observation_sources: []
    # 使用机器人 footprint 接近检测（与 costmap footprint 一致）
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6

costmap_filters:
  ros__parameters:
    use_sim_time: False