# Nav2 配置文件 - 人形机器人
# 机器人半径: 0.5m
# 最大速度: 0.3m/s
# 传感器: Factor Perception (OAK-D Pro)

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /factor_perception/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.1
      stateful: True

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.3
      vx_min: -0.1
      vy_max: 0.0
      wz_max: 0.5
      iteration_count: 1
      prune_distance: 1.0
      trajectory_step: 0.1
      keep_last_n_paths: 5
      motion_model: "Omni"
      optimize_dt: True
      CriticPluginNames:
        - "PathAlignCritic"
        - "GoalAlignCritic"
        - "ObstaclesCritic"
        - "CostCritic"
      PathAlignCritic:
        plugin: "nav2_mppi_controller::PathAlignCritic"
        enabled: True
        cost_power: 1
        cost_weight: 2.0
        heuristic: 0.5
        path_point_step: 4
      GoalAlignCritic:
        plugin: "nav2_mppi_controller::GoalAlignCritic"
        enabled: True
        cost_power: 1
        cost_weight: 1.0
        heuristic: 0.0
      ObstaclesCritic:
        plugin: "nav2_mppi_controller::ObstaclesCritic"
        enabled: True
        cost_power: 1
        repulsion_cost_weight: 5.0
        critical_cost_weight: 300.0
        consider_footprint: True
        collision_cost_weight: 1000.0
        collision_margin_distance: 0.1
        near_goal_distance: 0.5
      CostCritic:
        plugin: "nav2_mppi_controller::CostCritic"
        enabled: True
        cost_power: 1
        cost_weight: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: True
      width: 3.0
      height: 3.0
      resolution: 0.03
      track_unknown_space: False
      always_send_full_costmap: False
      update_frequency: 5.0
      publish_frequency: 2.0
      filter_threshold: 0.1

      # 机器人 footprint (圆形，半径0.5m)
      footprint: "[[0.5, 0.5], [0.5, -0.5], [-0.5, -0.5], [-0.5, 0.5]]"

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: "pointcloud"
        pointcloud:
          topic: /factor_perception/depth/points
          data_type: "PointCloud2"
          clearing: True
          marking: True
          max_obstacle_height: 1.5
          min_obstacle_height: 0.05
          obstacle_range: 2.5
          raytrace_range: 3.0
          inf_is_valid: False
          filter_threshold: 0.2

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.6
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: map
      robot_base_frame: base_link
      rolling_window: False
      track_unknown_space: True
      use_maximum: False
      unknown_cost_value: 255

      # 机器人 footprint
      footprint: "[[0.5, 0.5], [0.5, -0.5], [-0.5, -0.5], [-0.5, 0.5]]"

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: True
        map_topic: /factor_perception/grid_map
        first_map_only: False
        subscribe_to_updates: True
        use_maximum: False
        unknown_cost_value: 255
        trinary_costmap: True
        track_unknown_space: True
        transform_tolerance: 1.0

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: "pointcloud"
        pointcloud:
          topic: /factor_perception/depth/points
          data_type: "PointCloud2"
          clearing: True
          marking: True
          max_obstacle_height: 1.5
          min_obstacle_height: 0.05
          obstacle_range: 3.0
          raytrace_range: 3.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.6
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: True
      allow_unknown: True

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
      spin_dist: 1.57
      time_allowance: 30.0
    backup:
      plugin: "nav2_behaviors::BackUp"
      backup_dist: 0.3
      time_allowance: 30.0
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      dist_to_travel: 0.5
      time_allowance: 30.0
    wait:
      plugin: "nav2_behaviors::Wait"
      wait_time: 5.0
      time_allowance: 30.0

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    max_velocity: [0.3, 0.0, 0.5]
    min_velocity: [-0.1, 0.0, -0.5]
    max_accel: [0.5, 0.0, 1.0]
    min_accel: [-0.5, 0.0, -1.0]
    odom_topic: "/factor_perception/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    source_topics: ["scan", "pointcloud"]
    stop_pub_timeout: 2.0
    sources:
      scan:
        topic: "/factor_perception/depth/points"
        data_type: "PointCloud2"
        clearing: True
        marking: True
        min_z: 0.05
        max_z: 1.5
      pointcloud:
        topic: "/factor_perception/depth/points"
        data_type: "PointCloud2"
        min_z: 0.05
        max_z: 1.5

costmap_filters:
  ros__parameters:
    use_sim_time: False